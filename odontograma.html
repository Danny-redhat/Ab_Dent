<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odontograma Premium | ABDENT</title>
    
    <link rel="stylesheet" href="recursos/css/dashboard.css">

    <style>
        /* =========================================
           DISEÑO ESPECÍFICO DEL ODONTOGRAMA
           ========================================= */
        .contenedor-odontograma {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-width: 1100px; 
            margin: auto;
        }

        .panel-tratamientos {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .btn-tratamiento {
            background: white;
            border: 1px solid #ced4da;
            padding: 6px 2px;
            font-size: 11px; 
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn-tratamiento:hover { background: #e2e6ea; }
        .btn-tratamiento.activo { background: #3498db; color: white; border-color: #2980b9; }

        .fila-dientes {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        .linea-media {
            width: 3px;
            background-color: #34495e;
            margin: 0 10px;
        }

        .columna-diente {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50px; 
            position: relative; 
        }

        .numero-box {
            border: 1px solid #bdc3c7;
            width: 100%;
            text-align: center;
            font-size: 12px; 
            padding: 3px 0;
            color: #7f8c8d;
            background: #fdfdfd;
        }

        .imagen-diente {
            font-size: 38px; 
            margin: 5px 0;
            height: 55px; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; 
        }

        .imagen-diente::after {
            content: '';
            position: absolute;
            top: -5px; bottom: -5px; left: -5px; right: -5px;
            pointer-events: none;
            z-index: 1; 
        }

        .cruz-diente {
            display: grid;
            grid-template-columns: 15px 15px 15px;
            grid-template-rows: 15px 15px 15px;
            gap: 1px;
            background-color: #2c3e50;
            border: 1px solid #2c3e50;
            margin: 5px 0;
            position: relative; 
        }

        .cara { background-color: white; cursor: pointer; transition: 0.2s; }
        .cara:hover { background-color: #bdc3c7; }
        .cara.arriba { grid-column: 2; grid-row: 1; }
        .cara.izquierda { grid-column: 1; grid-row: 2; }
        .cara.centro { grid-column: 2; grid-row: 2; }
        .cara.derecha { grid-column: 3; grid-row: 2; }
        .cara.abajo { grid-column: 2; grid-row: 3; }

        /* ESTADOS CLÍNICOS */
        .columna-diente.estado-corona .cruz-diente { border-radius: 50%; box-shadow: 0 0 0 2px #3498db; }
        .columna-diente.estado-corona-temp .cruz-diente { border-radius: 50%; box-shadow: 0 0 0 2px #e74c3c; }

        .columna-diente.estado-ausente .imagen-diente::after {
            background: linear-gradient(to bottom right, transparent calc(50% - 1.5px), #3498db calc(50% - 1.5px), #3498db calc(50% + 1.5px), transparent calc(50% + 1.5px)),
                        linear-gradient(to top right, transparent calc(50% - 1.5px), #3498db calc(50% - 1.5px), #3498db calc(50% + 1.5px), transparent calc(50% + 1.5px));
        }

        .columna-diente.estado-fractura .imagen-diente::after {
            background: linear-gradient(to top right, transparent calc(50% - 1.5px), #e74c3c calc(50% - 1.5px), #e74c3c calc(50% + 1.5px), transparent calc(50% + 1.5px));
        }

        .columna-diente.estado-protesis-rem .imagen-diente::after {
            background: linear-gradient(to bottom, transparent 10%, #3498db 10%, #3498db 18%, transparent 18%, transparent 26%, #3498db 26%, #3498db 34%, transparent 34%) !important;
            z-index: 10;
        }

        /* ZONAS INTERDENTALES */
        .zona-diastema {
            position: absolute;
            right: -15px; 
            top: -5px;
            width: 25px; 
            height: 60px; 
            background-color: #a8e6cf; 
            border-radius: 50%;
            opacity: 0; 
            pointer-events: none; 
            z-index: 20;
            cursor: pointer;
            transition: 0.2s;
        }

        body.modo-diastema .zona-diastema { opacity: 0.6; pointer-events: auto; }
        body.modo-diastema .zona-diastema:hover { opacity: 0.9; }

        .zona-diastema.activo-diastema {
            opacity: 1 !important;
            background-color: transparent !important;
            pointer-events: auto; 
        }
        .zona-diastema.activo-diastema::before {
            content: ''; position: absolute; left: 2px; top: 16px; width: 8px; height: 28px; border-right: 4px solid #3498db; border-radius: 50%;
        }
        .zona-diastema.activo-diastema::after {
            content: ''; position: absolute; right: 2px; top: 16px; width: 8px; height: 28px; border-left: 4px solid #3498db; border-radius: 50%;
        }

        .zona-diastema.activo-transposicion {
            opacity: 1 !important;
            background-color: transparent !important;
            pointer-events: auto;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 50 20" xmlns="http://www.w3.org/2000/svg"><path d="M10,15 Q25,0 40,15" fill="none" stroke="%233498db" stroke-width="2"/><polygon points="10,15 16,10 14,18" fill="%233498db"/><polygon points="40,15 34,10 36,18" fill="%233498db"/></svg>');
            background-size: 45px 25px;
            background-position: center 10px;
            background-repeat: no-repeat;
        }

        .columna-diente.estado-migracion .imagen-diente::before { content: '←'; position: absolute; top: -25px; color: #3498db; font-size: 28px; font-weight: bold; z-index: 15; pointer-events: none; }
        .columna-diente.estado-rotacion .imagen-diente::before { content: '↷'; position: absolute; top: -25px; color: #3498db; font-size: 28px; font-weight: bold; z-index: 15; pointer-events: none; }

        .columna-diente.estado-erupcion .imagen-diente::before {
            content: ''; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 20px; height: 45px;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 20 45" xmlns="http://www.w3.org/2000/svg"><polyline points="15,0 5,12 15,24 5,35 10,35" fill="none" stroke="%233498db" stroke-width="2.5"/><polygon points="3,33 17,33 10,45" fill="%233498db"/></svg>');
            background-repeat: no-repeat; z-index: 15; pointer-events: none;
        }

        .columna-diente.estado-fusion .numero-box { border: 2px solid #3498db !important; border-radius: 15px; color: #3498db; font-weight: bold; background-color: white; transition: 0.2s; }
        .columna-diente.estado-remanente .imagen-diente::before { content: 'RR'; position: absolute; color: #e74c3c; font-size: 26px; font-weight: bold; z-index: 15; pointer-events: none; }
    </style>
</head>
<body>

    <nav class="menu-lateral">
        <div class="logo-clinica">
            <img src="recursos/img/ABDENT_BLANCO.png" alt="abdent-imagen">
        </div>
        
        <ul class="lista-menu">
            <li><a href="dashboard.html">Inicio (Resumen)</a></li>
            <li><a href="pacientes.html">Directorio de Pacientes</a></li>
            <li><a href="historial.html">Historiales y Consultas</a></li>
            <li><a href="#" class="activo">Odontogramas</a></li>
        </ul>

        <a href="index.html" class="boton-salir">Cerrar Sesión</a>
    </nav>

    <main class="area-trabajo">
        
        <header class="cabecera-dashboard">
            <div>
                <h1>Odontograma de la Consulta</h1>
                <a href="javascript:history.back()" style="color: #3498db; text-decoration: none; font-weight: bold;">&larr; Volver al Historial del Paciente</a>
            </div>
            <div class="usuario-actual">
                <span>Dr. Hector</span>
            </div>
        </header>

        <div class="contenedor-odontograma">

            <div class="panel-tratamientos">
                <button class="btn-tratamiento activo">Caries</button>
                <button class="btn-tratamiento">Corona</button>
                <button class="btn-tratamiento">Corona (Temp)</button>
                <button class="btn-tratamiento">Ausente</button>
                <button class="btn-tratamiento">Fractura</button>
                <button class="btn-tratamiento">Diastema</button>

                <button class="btn-tratamiento">Obturación</button>
                <button class="btn-tratamiento">Prótesis Rem</button>
                <button class="btn-tratamiento">Migración</button>
                <button class="btn-tratamiento">Rotación</button>
                <button class="btn-tratamiento">Fusión</button>
                <button class="btn-tratamiento">Remanente</button>

                <button class="btn-tratamiento">Erupción</button>
                <button class="btn-tratamiento">Transposición</button>
                <button class="btn-tratamiento">Supernumerario</button>
                <button class="btn-tratamiento">Pulpar</button>
                <button class="btn-tratamiento">Prótesis</button>
                <button class="btn-tratamiento">Perno</button>

                <button class="btn-tratamiento">Ortodoncia Fija</button>
                <button class="btn-tratamiento">Prótesis Fija</button>
                <button class="btn-tratamiento">Implante</button>
                <button class="btn-tratamiento">Macrodoncia</button>
                <button class="btn-tratamiento">Microdoncia</button>
                <button class="btn-tratamiento">Discromía</button>

                <button class="btn-tratamiento">Desgastado</button>
                <button class="btn-tratamiento">Semi-impactado</button>
                <button class="btn-tratamiento">Intrusión</button>
                <button class="btn-tratamiento">Edentulismo</button>
                <button class="btn-tratamiento">Ectópico</button>
                <button class="btn-tratamiento">Impactado</button>

                <button class="btn-tratamiento">Ortodoncia Rem</button>
                <button class="btn-tratamiento">Extrusión</button>
                <button class="btn-tratamiento">Poste</button>

                <div style="grid-column: span 2;"></div>
                <button class="btn-tratamiento" style="background: #e74c3c; color: white; border-color: #c0392b;">Limpiar Odontograma</button>
            </div>

            <div class="fila-dientes" id="zona-superior">
                <div id="cuadrante-1" style="display: flex; gap: 2px;"></div>
                <div class="linea-media"></div>
                <div id="cuadrante-2" style="display: flex; gap: 2px;"></div>
            </div>

            <div class="fila-dientes" id="zona-inferior" style="border-bottom: none;">
                <div id="cuadrante-4" style="display: flex; gap: 2px;"></div>
                <div class="linea-media"></div>
                <div id="cuadrante-3" style="display: flex; gap: 2px;"></div>
            </div>

        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const c1 = [18, 17, 16, 15, 14, 13, 12, 11]; 
            const c2 = [21, 22, 23, 24, 25, 26, 27, 28]; 
            const c4 = [48, 47, 46, 45, 44, 43, 42, 41]; 
            const c3 = [31, 32, 33, 34, 35, 36, 37, 38]; 

            function dibujarSuperiores(arrayNumeros, contenedorId) {
                const contenedor = document.getElementById(contenedorId);
                arrayNumeros.forEach(num => {
                    contenedor.innerHTML += `
                        <div class="columna-diente">
                            <div class="numero-box">${num}</div>
                            <div class="imagen-diente">🦷<div class="zona-diastema"></div> </div>
                            <div class="cruz-diente">
                                <div class="cara arriba"></div><div class="cara izquierda"></div><div class="cara centro"></div><div class="cara derecha"></div><div class="cara abajo"></div>
                            </div>
                            <div class="numero-box">${num}</div>
                        </div>
                    `;
                });
            }

            function dibujarInferiores(arrayNumeros, contenedorId) {
                const contenedor = document.getElementById(contenedorId);
                arrayNumeros.forEach(num => {
                    contenedor.innerHTML += `
                        <div class="columna-diente">
                            <div class="numero-box">${num}</div>
                            <div class="cruz-diente">
                                <div class="cara arriba"></div><div class="cara izquierda"></div><div class="cara centro"></div><div class="cara derecha"></div><div class="cara abajo"></div>
                            </div>
                            <div class="imagen-diente" style="transform: rotate(180deg);">🦷<div class="zona-diastema"></div> </div>
                            <div class="numero-box">${num}</div>
                        </div>
                    `;
                });
            }

            dibujarSuperiores(c1, "cuadrante-1");
            dibujarSuperiores(c2, "cuadrante-2");
            dibujarInferiores(c4, "cuadrante-4");
            dibujarInferiores(c3, "cuadrante-3");

            let tratamientoActual = "Caries";
            let colorActual = "#e74c3c";

            const coloresTratamientos = {
                "Caries": "#e74c3c", "Obturación": "#3498db", "default": "#2ecc71"
            };

            const tratamientosDienteCompleto = {
                "Corona": "estado-corona", "Corona (Temp)": "estado-corona-temp", "Ausente": "estado-ausente", "Fractura": "estado-fractura",
                "Prótesis Rem": "estado-protesis-rem", "Migración": "estado-migracion", "Rotación": "estado-rotacion",
                "Fusión": "estado-fusion", "Remanente": "estado-remanente", "Erupción": "estado-erupcion"
            }; 

            const botones = document.querySelectorAll(".btn-tratamiento");

            botones.forEach(boton => {
                boton.addEventListener("click", function() {
                    if(this.innerText === "Limpiar Odontograma") {
                        if(confirm("¿Limpiar todo el odontograma? Se borrarán los colores.")) {
                            document.querySelectorAll(".cara").forEach(c => { c.style.backgroundColor = "white"; c.removeAttribute("data-tratamiento"); });
                            document.querySelectorAll(".columna-diente").forEach(c => c.classList.remove("estado-corona", "estado-corona-temp", "estado-ausente", "estado-fractura", "estado-protesis-rem", "estado-migracion", "estado-rotacion", "estado-fusion", "estado-remanente", "estado-erupcion"));
                            document.querySelectorAll(".zona-diastema").forEach(z => z.classList.remove("activo-diastema", "activo-transposicion")); 
                        }
                        return;
                    }

                    botones.forEach(b => b.classList.remove("activo"));
                    this.classList.add("activo");
                    tratamientoActual = this.innerText;
                    colorActual = coloresTratamientos[tratamientoActual] || coloresTratamientos["default"];

                    if(tratamientoActual === "Diastema" || tratamientoActual === "Transposición") {
                        document.body.classList.add("modo-diastema");
                    } else {
                        document.body.classList.remove("modo-diastema");
                    }
                });
            });

            document.addEventListener("click", function(evento) {
                if(evento.target.classList.contains("zona-diastema")) {
                    if (tratamientoActual === "Diastema") {
                        evento.target.classList.toggle("activo-diastema");
                        evento.target.classList.remove("activo-transposicion");
                    } else if (tratamientoActual === "Transposición") {
                        evento.target.classList.toggle("activo-transposicion");
                        evento.target.classList.remove("activo-diastema");
                    }
                    return; 
                }

                const columna = evento.target.closest(".columna-diente");
                if(!columna) return;

                const cara = evento.target.classList.contains("cara") ? evento.target : null;

                if (tratamientosDienteCompleto[tratamientoActual]) {
                    const claseEstado = tratamientosDienteCompleto[tratamientoActual];
                    if(columna.classList.contains(claseEstado)) {
                        columna.classList.remove(claseEstado);
                    } else {
                        Object.values(tratamientosDienteCompleto).forEach(clase => columna.classList.remove(clase));
                        columna.classList.add(claseEstado);
                    }
                } else if (cara) {
                    if(cara.getAttribute("data-tratamiento") === tratamientoActual) {
                        cara.style.backgroundColor = "white";
                        cara.removeAttribute("data-tratamiento");
                    } else {
                        cara.style.backgroundColor = colorActual;
                        cara.setAttribute("data-tratamiento", tratamientoActual);
                    }
                }
            });
        });
    </script>
</body>
</html>
