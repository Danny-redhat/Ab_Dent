<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Clínica Dental</title>
    <link rel="stylesheet" href="recursos/css/style.css">
</head>
<body>

    <div class="contenedor-login">
        <div class="tarjeta-login">
            <img src="recursos/img/LOGO_ABDENT.png" alt="LOGO_ABDENT" class="imagen_abdent">
            <h2>Crear Nueva Cuenta</h2>
            <p>Registra a un nuevo doctor o asistente en el sistema</p>
            
            <form id="formularioRegistro">
                
                <div class="grupo-input">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Héctor" required>
                </div>

                <div class="grupo-input">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Perez">
                </div>

                <div class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="doctor@clinica.com" required>
                </div>

                <div class="grupo-input">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="grupo-input">
                    <label for="rol">Cargo en la clínica:</label>
                    <select id="rol" name="rol">
                        <option value="dentista">Dentista</option>
                        <option value="asistente">Asistente</option>
                        <option value="admin">Administrador principal</option>
                    </select>
                </div>

                <button type="submit" class="btn-principal">Crear Cuenta</button>
            </form>

            <div class="enlaces-extra">
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
            </div>

            <div id="mensajeAlerta" style="margin-top: 15px; text-align: center; color: red;"></div>

        </div>
    </div>
    <script src="recursos/js/autenticador.js"></script>

</body>
</html>
